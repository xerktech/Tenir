# tenir — LiteLLM gateway config.
#
# One OpenAI-compatible front door (http://litellm:4000) for the STT model: the
# api sends /v1/audio/transcriptions with the short alias "parakeet" and the
# gateway routes it to the parakeet STT server. The api carries a single base URL
# + key, and LiteLLM adds shared auth (the master key below).
#
# model_name is the short alias apps send as "model" — keep it in sync with the
# api's API_STT_MODEL. litellm_params.model is the provider-prefixed model id; the
# parakeet server serves one model and ignores the id, so it's cosmetic. api_base
# is the compose service DNS name; api_key on the routed entry is a placeholder
# (the server doesn't authenticate) — real auth is the master key below.

model_list:
  # Live STT — Parakeet on the parakeet server, OpenAI /audio/transcriptions. mode
  # flags it for the transcription route (LiteLLM otherwise assumes chat). Routed
  # via the openai/ provider: the parakeet server implements verbose_json, so the
  # openai transform's json->verbose_json rewrite (to read 'duration' for cost
  # calc) works — the very rewrite vLLM-served Voxtral 400'd on, which is why the
  # old route needed mistral/. verbose_json also carries the word timestamps back.
  - model_name: parakeet
    litellm_params:
      model: openai/parakeet-tdt-0.6b-v3
      api_base: http://parakeet:8000/v1
      api_key: tenir-local
    model_info:
      mode: audio_transcription

  # Cue/summary + translation LLM (XERK-81, XERK-160) — the alias the api sends
  # when API_CUE_BACKEND / API_TRANSLATION_BACKEND = openai (API_LLM_MODEL =
  # gpt-oss:120b). A plain chat model (no mode → /chat/completions), so both route
  # through this SAME gateway, no new URL/key var. Fronts Ollama's OpenAI-compatible
  # surface, exactly as the deployed gateway fronts the tenir-ollama-cue container;
  # reasoning_effort matches the July 2026 cue-model eval's setting. The backend
  # (ollama-cue) is only up under `docker compose --profile cues up`; without it
  # this route just 503s and cues/translations stay silent — captions are unaffected.
  - model_name: gpt-oss:120b
    litellm_params:
      model: openai/gpt-oss:120b
      api_base: http://ollama-cue:11434/v1
      api_key: tenir-local
      reasoning_effort: medium
      # Without this allowlist, drop_params silently strips reasoning_effort
      # (LiteLLM's model map doesn't know gpt-oss:120b supports it) and the
      # backend runs at Ollama's default — verified by watching the proxied
      # payloads during the XERK-180 route split. Ollama's gpt-oss default
      # happens to BE medium, so cues behaved as intended, but only by luck;
      # pin it explicitly so the dial actually works on both routes.
      allowed_openai_params: ["reasoning_effort"]

  # Translation route (XERK-180) — SAME weights and backend as the cue alias
  # above, but with the reasoning dial at low. The Aug 2026 translation eval
  # (scripts/translation_eval/RESULTS-2026-08.md) measured low at ~2x the speed
  # of medium (p50 0.82s vs 1.21s serialized, p90 3.6s vs 7.6s at prod
  # concurrency — medium blows the 1-2s translation budget) with accuracy
  # within noise on conversational speech; dedicated smaller models all lost
  # accuracy. Splitting the alias lets translations shed the cue route's
  # reasoning tax without touching cue behavior. Matches API_TRANSLATION_MODEL.
  - model_name: gpt-oss:120b-translate
    litellm_params:
      model: openai/gpt-oss:120b
      api_base: http://ollama-cue:11434/v1
      api_key: tenir-local
      reasoning_effort: low
      allowed_openai_params: ["reasoning_effort"]

litellm_settings:
  # Drop OpenAI params the backend doesn't implement instead of erroring.
  drop_params: true

general_settings:
  # Proxy admin key (sk-…, from the LITELLM_MASTER_KEY env). The api
  # authenticates with this key.
  master_key: os.environ/LITELLM_MASTER_KEY
