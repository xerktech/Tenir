# tenir — LiteLLM gateway config.
#
# One OpenAI-compatible front door (http://litellm:4000) for the STT model: the
# api sends /v1/audio/transcriptions with the short alias "parakeet" and the
# gateway routes it to the parakeet STT server. The api carries a single base URL
# + key, and LiteLLM adds shared auth (the master key below).
#
# model_name is the short alias apps send as "model" — keep it in sync with the
# api's API_STT_MODEL. litellm_params.model is the provider-prefixed model id; the
# parakeet server serves one model and ignores the id, so it's cosmetic. api_base
# is the compose service DNS name; api_key on the routed entry is a placeholder
# (the server doesn't authenticate) — real auth is the master key below.

model_list:
  # Live STT — Parakeet on the parakeet server, OpenAI /audio/transcriptions. mode
  # flags it for the transcription route (LiteLLM otherwise assumes chat). Routed
  # via the openai/ provider: the parakeet server implements verbose_json, so the
  # openai transform's json->verbose_json rewrite (to read 'duration' for cost
  # calc) works — the very rewrite vLLM-served Voxtral 400'd on, which is why the
  # old route needed mistral/. verbose_json also carries the word timestamps back.
  - model_name: parakeet
    litellm_params:
      model: openai/parakeet-tdt-0.6b-v3
      api_base: http://parakeet:8000/v1
      api_key: tenir-local
    model_info:
      mode: audio_transcription

  # Cue/summary + translation LLM (XERK-81, XERK-160) — the alias the api sends
  # when API_CUE_BACKEND / API_TRANSLATION_BACKEND = openai (API_LLM_MODEL =
  # qwen3.8-27b-dflash). A plain chat model (no mode → /chat/completions), so both
  # routes go through this SAME gateway, no new URL/key var. Fronts the
  # OpenAI-compatible surface of the Qwen3.8-27B SGLang server on the GPU box
  # (NVFP4 weights + DFlash speculative decoding), which replaced the retired
  # Ollama gpt-oss:120b deployment. api_key is a placeholder — the SGLang server
  # does no auth, but LiteLLM's OpenAI client needs a non-empty key to route.
  # The thinking toggle rides chat_template_kwargs.enable_thinking (Qwen's chat
  # template), off by default so cues/translations get fast structured JSON; it is
  # allowlisted so drop_params doesn't strip it (see the note on the route below).
  - model_name: qwen3.8-27b-dflash
    litellm_params:
      model: openai/qwen3.8-27b
      api_base: http://maxai.xerktech.com:9402/v1
      api_key: sk-none
      # Without this allowlist, drop_params silently strips chat_template_kwargs
      # and the model keeps thinking on, spending the whole token budget on
      # reasoning and returning empty content — the exact failure the retired
      # Qwen3 server showed. Pin it explicitly so the thinking toggle actually
      # reaches the backend on both routes.
      allowed_openai_params: ["chat_template_kwargs"]

  # Translation route (XERK-180) — SAME weights and backend as the cue alias
  # above, on its own alias so the api can point translation traffic at a distinct
  # route without touching cue behavior. Qwen has no reasoning_effort dial, so both
  # routes share the same params and the thinking toggle is set per-request by the
  # api rather than pinned per-route. Matches API_TRANSLATION_MODEL.
  - model_name: qwen3.8-27b-dflash-translate
    litellm_params:
      model: openai/qwen3.8-27b
      api_base: http://maxai.xerktech.com:9402/v1
      api_key: sk-none
      allowed_openai_params: ["chat_template_kwargs"]

litellm_settings:
  # Drop OpenAI params the backend doesn't implement instead of erroring.
  drop_params: true

general_settings:
  # Proxy admin key (sk-…, from the LITELLM_MASTER_KEY env). The api
  # authenticates with this key.
  master_key: os.environ/LITELLM_MASTER_KEY
