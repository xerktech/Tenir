# tenir — single-host stack: `docker compose up --build`.
#
# Bare minimum: one app container (api + web UI), Postgres for transcripts,
# the LiteLLM gateway, and ONE GPU STT server (needs the NVIDIA Container
# Toolkit): Parakeet decodes both the live partials (a bounded trailing-window
# re-decode each cadence) and the accurate finals. A two-model "hybrid" streaming
# variant (a separate Nemotron partials server) was evaluated and removed: once
# the CUDA-graph decoder was benched out (Tenir PR #99), the re-decode partial
# costs ~60-85 ms — comfortably inside even a 350 ms cadence — and the measured
# hybrid partials diverged 18.3 % from the Parakeet final on identical audio
# (visible caption churn at every endpoint). See docs/stt-rtx4060-benchmark.md
# §5. Real prod values come from .env (the ${VAR:-default} fallbacks are this
# host's defaults).

name: tenir

services:
  app:
    # ONE container: FastAPI serves the WS/REST api AND the built web SPA on
    # :8080 (same origin, so no CORS and no separate web container). The build
    # context is the repo root — the web build needs the workspace packages.
    build:
      context: .
      dockerfile: api/Dockerfile
      args:
        API_EXTRAS: "persistence"
    image: tenir:latest
    ports:
      - "8080:8080"
    environment:
      # Backend selectors are hardcoded — this file starts the matching services, so a
      # .env override would only desync the api. Endpoints/secrets/models come from .env.
      API_LITELLM_ENDPOINT: ${API_LITELLM_ENDPOINT:-http://litellm:4000/v1}
      API_LITELLM_API_KEY: ${LITELLM_MASTER_KEY:-sk-tenir-master}
      # "parakeet": one model does everything — partials re-decode a bounded
      # trailing window each cadence, finals decode the whole turn. ("stub" is the
      # model-free CI/simulator backend.)
      API_STT_BACKEND: ${API_STT_BACKEND:-parakeet}
      API_STT_MODEL: ${API_STT_MODEL:-parakeet}
      # Partial cadence. 350 ms (down from the pre-PR-#99 700 ms) keeps caption
      # freshness at parity with the retired hybrid: the windowed re-decode costs
      # ~60-85 ms on a modest GPU, well inside this budget.
      API_STT_PARTIAL_INTERVAL_MS: ${API_STT_PARTIAL_INTERVAL_MS:-350}
      # Direct route for the FINALS hot path (XERK-115). Live captions send one
      # transcription request per final — so the gateway hop (an extra proxy round
      # trip plus its json->verbose_json rewrite) is avoided. On this single-host
      # stack the api shares a network with the model server, so it posts audio
      # straight to it; cues still go through LiteLLM. Unset this in a split-host
      # deploy that can only reach the model through the gateway — the api then
      # falls back to API_LITELLM_ENDPOINT on its own.
      API_STT_ENDPOINT: ${API_STT_ENDPOINT:-http://parakeet:8000/v1}
      # Cues (XERK-81): private context cards derived from the conversation. Off by
      # default so the base stack stays STT-only. Set API_CUE_BACKEND=stub for
      # model-free demo cues (no extra container), or =openai to route to a real chat
      # model through the SAME LiteLLM gateway — start it with `--profile cues`, which
      # brings up ollama-cue + registers the gpt-oss:120b alias in litellm/config.yaml.
      API_CUE_BACKEND: ${API_CUE_BACKEND:-off}
      API_LLM_MODEL: ${API_LLM_MODEL:-gpt-oss:120b}
      # Live translations (XERK-160): non-English turns are translated to English
      # and shown alongside the transcript (the glasses show them in the cue box).
      # Off by default like cues; "stub" is model-free, "openai" routes to the
      # same gateway + Ollama backend the cues use (`--profile cues` for the
      # model) via the dedicated gpt-oss:120b-translate alias — same weights,
      # reasoning_effort low (XERK-180; see scripts/translation_eval/).
      API_TRANSLATION_BACKEND: ${API_TRANSLATION_BACKEND:-off}
      API_TRANSLATION_MODEL: ${API_TRANSLATION_MODEL:-gpt-oss:120b-translate}
      # How long speech may go quiet after the last non-English activity before
      # the run is declared done and the glasses' dismiss countdown starts.
      API_TRANSLATION_HOLD_MS: ${API_TRANSLATION_HOLD_MS:-3000}
      # Music ID (XERK-184): when a song is playing, recognize the track from a
      # short audio window and show its time-synced lyrics in the cue box,
      # auto-scrolling. "off" (default) keeps the core STT-only; "stub" is a
      # model-free demo (no network); "shazam" is real recognition via shazamio
      # (Shazam's global catalog) + synced lyrics from LRCLIB. The [music] extra
      # must be installed in the api image for "shazam"; see docs/music-id.md.
      API_MUSIC_BACKEND: ${API_MUSIC_BACKEND:-off}
      API_MUSIC_LYRICS_ENDPOINT: ${API_MUSIC_LYRICS_ENDPOINT:-https://lrclib.net}
      # Cue evidence retrieval (XERK-120): grounds cue facts in live sources —
      # the RSS-fed news corpus, Wikipedia, and a self-hosted SearXNG — because
      # the cue model's weights are years stale. "off" (default) keeps cues
      # exactly as before; set "live" (with cues on) to ground them. The SearXNG
      # endpoint is deployment infra with no safe public default, so the web
      # tier stays off until you point it at your instance.
      API_CUE_RETRIEVAL_BACKEND: ${API_CUE_RETRIEVAL_BACKEND:-off}
      API_CUE_SEARXNG_ENDPOINT: ${API_CUE_SEARXNG_ENDPOINT:-}
      API_HOUSEHOLD_ID: ${API_HOUSEHOLD_ID:-default}
      # You MUST override API_AUTH_SECRET — the api refuses to boot with the default.
      API_AUTH_SECRET: ${API_AUTH_SECRET:-dev-insecure-change-me}
      # Bearer-token lifetime. Tokens auto-renew on use (sliding, XERK-168), so this
      # is the max *idle* time before a device is asked to log in again.
      API_AUTH_TOKEN_TTL_SECONDS: ${API_AUTH_TOKEN_TTL_SECONDS:-2592000}
      API_AUTH_ADMIN_USERNAME: ${API_AUTH_ADMIN_USERNAME:-}
      API_AUTH_ADMIN_PASSWORD: ${API_AUTH_ADMIN_PASSWORD:-}
      API_AUTH_ADMIN_HOUSEHOLD: ${API_AUTH_ADMIN_HOUSEHOLD:-default}
      API_PERSISTENCE_BACKEND: postgres
      API_AUDIO_BACKEND: disk
      API_AUDIO_DIR: /data/audio
      API_DATABASE_URL: postgresql://tenir:tenir@postgres-tenir:5432/tenir
      # Status page: on this single-host stack the api shares a network with the
      # model servers, so it probes them directly for a per-model light. Leave unset
      # in a split-host deploy — each light then follows the LiteLLM gateway probe.
      # The cue LLM only runs (and is only probed) under the "cues" profile.
      API_STATUS_STT_URL: ${API_STATUS_STT_URL:-http://parakeet:8000}
      # Left unset: Ollama serves no GET /health, so the cue-LLM light follows the
      # LiteLLM gateway probe (the api's real path to it) — same as split-host prod.
      API_STATUS_LLM_URL: ${API_STATUS_LLM_URL:-}
    volumes:
      # Retained full audio (the "disk" audio backend). Bind-mounted so it survives
      # container recreation.
      - "C:/docker/tenir/audio:/data/audio"
    depends_on:
      postgres-tenir:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-tenir:
    # Transcripts + users. Plain Postgres — no pgvector needed anymore.
    image: postgres:16
    environment:
      POSTGRES_USER: tenir
      POSTGRES_PASSWORD: tenir
      POSTGRES_DB: tenir
    ports:
      - "5432:5432"
    volumes:
      - "C:/docker/tenir/postgres:/var/lib/postgresql/data"
      # Applied once on first boot of an empty data dir.
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tenir"]
      interval: 10s
      timeout: 5s
      retries: 5

  litellm:
    # OpenAI-compatible gateway fronting the parakeet STT server, so the api uses
    # one base URL + key. Routing lives in litellm/config.yaml. CPU-only — it
    # proxies, it doesn't run the model. The non-database image: master-key auth,
    # no Postgres needed.
    image: ${LITELLM_IMAGE:-ghcr.io/berriai/litellm:main-stable}
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    ports:
      - "4000:4000"
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    environment:
      # OVERRIDE in prod.
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-tenir-master}
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')\""]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----- GPU model server (needs the NVIDIA Container Toolkit) -----------------

  parakeet:
    # Live STT: NVIDIA Parakeet (parakeet-tdt-0.6b-v3, multilingual + auto language
    # detection) behind an OpenAI /v1/audio/transcriptions surface; the LiteLLM
    # gateway aliases it as "parakeet" for the api. Built from parakeet-stt/Dockerfile
    # (NGC NeMo base) — the same image the release pipeline publishes.
    build:
      context: .
      dockerfile: parakeet-stt/Dockerfile
    image: tenir-parakeet-stt:latest
    ports:
      - "9401:8000"
    volumes:
      # Whole /root/.cache so the HF hub cache AND NeMo's torch cache persist — the
      # ~2.4 GB weights download once.
      - "C:/docker/tenir/parakeet:/root/.cache"
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}
      PARAKEET_MODEL: ${PARAKEET_MODEL:-nvidia/parakeet-tdt-0.6b-v3}
      # Set 0 on hosts whose driver predates the container's CUDA toolkit
      # (minor-version compat mode rejects the CUDA-graph decoder's kernels) —
      # see docs/stt-rtx4060-benchmark.md.
      PARAKEET_CUDA_GRAPHS: ${PARAKEET_CUDA_GRAPHS:-1}
    ipc: host
    healthcheck:
      # 503 until the model is resident (first boot downloads the weights), 200 after.
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 300s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  ollama-cue:
    # Cue/summary + translation LLM (XERK-81, XERK-160): a chat model the api calls
    # through the SAME LiteLLM gateway. Opt-in — only started with `--profile cues`
    # (it's a large model and needs its own GPU share alongside the STT servers).
    # gpt-oss-120b on Ollama, mirroring the deployed tenir-gpu stack (the July 2026
    # cue-model eval retired the earlier vLLM/Qwen server — see
    # scripts/cue_eval/RESULTS-2026-07.md). The gateway aliases it as "gpt-oss:120b"
    # (litellm/config.yaml), matching API_LLM_MODEL. Version PINNED like prod: cue
    # behaviour must not shift under a silent runtime upgrade.
    profiles: ["cues"]
    image: ${OLLAMA_IMAGE:-ollama/ollama:0.32.4}
    # Serve, then pull the model (no-op once cached — the ~65 GB GGUF persists in
    # the volume), then keep serving in the foreground.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "/bin/ollama serve & sleep 8; /bin/ollama pull ${OLLAMA_CUE_MODEL:-gpt-oss:120b}; wait"
    ports:
      - "9300:11434"
    volumes:
      - "C:/docker/tenir/ollama-cue:/root/.ollama"
    environment:
      # Cue prompts are ~2.5k tokens (system prompt + turn window + avoid list);
      # 16384 matches the eval and leaves ample room (translations are far smaller).
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CUE_CONTEXT_LENGTH:-16384}
      # Keep the model resident — a cue/translation attempt must never pay the
      # model-load penalty mid-conversation.
      OLLAMA_KEEP_ALIVE: "-1"
      OLLAMA_FLASH_ATTENTION: "1"
    healthcheck:
      test: ["CMD", "ollama", "ls"]
      interval: 15s
      timeout: 5s
      retries: 20
      # First boot on an empty volume downloads the ~65 GB GGUF.
      start_period: 1800s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
