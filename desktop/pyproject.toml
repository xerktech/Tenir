[project]
name = "tenir-capture"
description = "Tenir meeting-caption capture client for Windows (XERK-2506)"
requires-python = ">=3.11"
# The shipped version is stamped into tenir_capture/_version.py by the release build.
version = "0.0.0"
dependencies = [
  "numpy>=2",
  "pillow>=11",
  "websockets>=14",
  # Windows-only: Windows Graphics Capture and toast notifications.
  "windows-capture==2.0.1; sys_platform == 'win32'",
  "plyer==2.1.0; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff==0.17.3"]
build = ["pyinstaller==6.22.3"]

[project.scripts]
tenir-capture = "tenir_capture.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tenir_capture*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=tenir_capture --cov-report=term-missing --cov-fail-under=85"

[tool.coverage.run]
# Windows-only glue (ctypes, WGC, schtasks), exercised by the Windows build smoke test.
omit = ["tenir_capture/win.py"]

[tool.ruff]
line-length = 100
