name: Scripts

# PR gate for the shell scripts under scripts/, plus the translation-eval and long-form
# eval harness tests.
# evenhub-sim-guarded.sh is the
# Even Hub simulator memory guard the QA recipe depends on (XERK-1020); a
# fail-open or teardown regression there can take down a shared agent pod, so
# every script is shellcheck-linted and the guard's exit contract is tested
# with fake simulators (scripts/tests/evenhub-sim-guarded.test.sh).
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/**/*.sh'
      - 'scripts/translation_eval/public/**'
      - 'scripts/longform_eval/**'
      # the long-form replay test decides language with the shipped langid
      - 'api/src/api/stt/langid.py'
      # the harness tests build requests from the shipped translator prompt, so a
      # change there must re-run them (prompt-drift guard)
      - 'api/src/api/translate/**'
      - '.github/workflows/scripts.yml'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  shell:
    name: Scripts (shellcheck + guard tests)
    # GitHub-hosted: shellcheck ships on the ubuntu image; the tests need only
    # bash + procps and stub xvfb-run, so no X server or simulator download.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: shellcheck
        run: |
          shellcheck --version
          find scripts -name '*.sh' -print0 | xargs -0r shellcheck

      - name: Test the simulator memory guard
        run: scripts/tests/evenhub-sim-guarded.test.sh

  translation-eval:
    name: Translation eval harness (unit tests)
    # scripts/translation_eval/public: the prompt-adapter shim (driven as a real FastAPI
    # app), the app's translate trigger and the replay subset. Imports the api package,
    # so it installs it the way api.yml does.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api/pyproject.toml

      - name: Install the api package
        run: pip install -e 'api[dev]'

      - name: Run the harness tests
        run: python -m pytest scripts/translation_eval/public/tests -q

      # scripts/longform_eval (XERK-1414): scorer alignment, replay of the translation
      # trigger, OCR mask. Its tests importorskip the scoring libs, so install them —
      # otherwise a green run would mean "skipped".
      - name: Install the long-form harness deps
        run: pip install jiwer sacrebleu numpy pillow

      - name: Run the long-form harness tests
        run: python -m pytest scripts/longform_eval/tests -q -rs
