name: Scripts

# PR gate for the shell scripts under scripts/, plus the translation-eval and long-form
# eval harness tests. Every script is shellcheck-linted.
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/**/*.sh'
      - 'scripts/translation_eval/public/**'
      - 'scripts/longform_eval/**'
      # segment_sim.py subclasses the live StreamingTranscriber, so a refactor there
      # must re-run its tests (a refactor once left it silently reporting 0 turns)
      - 'scripts/stt_eval/**'
      - 'api/src/api/stt/streaming.py'
      # the long-form replay test decides language with the shipped langid
      - 'api/src/api/stt/langid.py'
      # the harness tests build requests from the shipped translator prompt, so a
      # change there must re-run them (prompt-drift guard)
      - 'api/src/api/translate/**'
      - '.github/workflows/scripts.yml'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  shell:
    name: Scripts (shellcheck)
    # GitHub-hosted: shellcheck ships on the ubuntu image.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: shellcheck
        run: |
          shellcheck --version
          find scripts -name '*.sh' -print0 | xargs -0r shellcheck

  translation-eval:
    name: Translation eval harness (unit tests)
    # scripts/translation_eval/public: the prompt-adapter shim (driven as a real FastAPI
    # app), the app's translate trigger and the replay subset. Imports the api package,
    # so it installs it the way api.yml does.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api/pyproject.toml

      - name: Install the api package
        run: pip install -e 'api[dev]'

      # scripts/longform_eval (XERK-1414): scorer alignment, replay of the translation
      # trigger, OCR mask. Its tests importorskip the scoring libs, so install them —
      # otherwise a green run would mean "skipped".
      - name: Install the long-form harness deps
        run: pip install jiwer sacrebleu numpy pillow

      # One pytest process over every harness, on purpose: each test dir puts its
      # harness on sys.path and imports modules by bare name, so two harnesses sharing
      # a module name (e.g. a top-level score.py) would import the wrong one. Separate
      # calls hid that (XERK-2536). scripts/stt_eval covers the scorer, audio slicing
      # and segment_sim's VAD replay, which hooks StreamingTranscriber internals and
      # broke silently when they changed.
      - name: Run the harness tests
        run: >-
          python -m pytest -q -rs
          scripts/translation_eval/public/tests
          scripts/longform_eval/tests
          scripts/stt_eval/tests
