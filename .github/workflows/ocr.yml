name: OCR

# PR gate for the tenir-ocr image (ocr/). Unit tests run against a fake engine; the image job
# builds the real image and smoke-tests the real PaddleOCR engine through /v1/ocr, since the
# image is small enough (python-slim + Paddle CPU) for a hosted runner. Publishing is the
# unified release pipeline (release.yml).
on:
  pull_request:
    branches: [main]
    paths:
      - 'ocr/**'
      - '.github/workflows/ocr.yml'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Server tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ocr
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ocr/requirements-test.txt
      - run: pip install -r requirements-test.txt
      - run: pytest tests -q

  image:
    name: Image build + smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Lint ocr/Dockerfile
        run: |
          docker run --rm -i hadolint/hadolint:v2.12.0 \
            hadolint --failure-threshold error - < ocr/Dockerfile
      - name: Build
        run: docker build -f ocr/Dockerfile -t tenir-ocr:ci .
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Smoke
        run: |
          docker run -d --name ocr -p 8000:8000 -e OCR_WORKERS=2 tenir-ocr:ci
          for _ in $(seq 1 60); do curl -sf localhost:8000/health && break; sleep 2; done
          pip install pillow
          python ocr/smoke.py http://127.0.0.1:8000 || { docker logs ocr; exit 1; }
