name: Veiller

# PR gate for the Veiller miniapp build of the Tenir G2 client. Self-contained
# (Bun + vendored SDK tarballs, not an npm workspace member), so its checks
# depend only on veiller/. On a PR: typecheck + test + build. Packing the .zip
# and attaching it to a release happens in the unified release pipeline
# (release.yml), which stamps the version into miniapp.json first.
on:
  pull_request:
    branches: [main]
    paths:
      - 'veiller/**'
      - '.github/workflows/veiller.yml'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Veiller miniapp (typecheck + test + build)
    # GitHub-hosted: a Bun install + build. No docker layer cache to keep warm and nothing large
    # on disk, so self-hosting only added queue time behind the image builds.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.22"

      - name: Install dependencies
        working-directory: veiller
        run: bun install --frozen-lockfile

      - name: Typecheck
        working-directory: veiller
        run: bun run typecheck

      - name: Test
        working-directory: veiller
        run: bun test

      - name: Build
        working-directory: veiller
        run: bun run build
