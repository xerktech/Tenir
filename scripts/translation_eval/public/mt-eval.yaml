apiVersion: resource.k8s.io/v1
kind: ResourceClaim
metadata:
  name: mt-eval-rtx6000
  namespace: ai
  labels: {app: mt-eval, owner: claude-translation-eval}
spec:
  devices:
    requests:
    - name: gpu
      exactly:
        deviceClassName: gpu.nvidia.com
        count: 1
        selectors:
        - cel:
            expression: 'device.attributes["gpu.nvidia.com"].productName.contains("RTX PRO 6000")'
---
apiVersion: v1
kind: Pod
metadata:
  name: mt-eval
  namespace: ai
  labels: {app: mt-eval, owner: claude-translation-eval}
spec:
  nodeSelector: {kubernetes.io/hostname: talos04.xerktech.com}
  tolerations: [{key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}]
  imagePullSecrets: [{name: ghcr}]
  restartPolicy: Never
  resourceClaims: [{name: gpu, resourceClaimName: mt-eval-rtx6000}]
  containers:
  - name: vllm
    image: vllm/vllm-openai:v0.30.0-cu129
    command: ["sleep", "infinity"]
    env:
    - {name: HF_HOME, value: /models/hf}
    resources:
      claims: [{name: gpu}]
      requests: {cpu: "8", memory: 32Gi}
      limits: {memory: 96Gi}
    volumeMounts:
    - {name: models, mountPath: /models}
    - {name: shm, mountPath: /dev/shm}
  - name: tenir
    image: ${TENIR_IMAGE}
    env:
    - {name: API_PORT, value: "8080"}
    - {name: API_STT_BACKEND, value: parakeet}
    - {name: API_STT_MODEL, value: parakeet}
    - {name: API_STT_ENDPOINT, value: "http://tenir-parakeet.ai.svc.cluster.local:8000/v1"}
    - {name: API_STT_PARTIAL_INTERVAL_MS, value: "350"}
    - {name: API_LITELLM_ENDPOINT, value: "http://127.0.0.1:9000/v1"}
    - {name: API_TRANSLATION_BACKEND, value: openai}
    - {name: API_TRANSLATION_MODEL, value: candidate}
    - {name: API_TRANSLATION_HOLD_MS, value: "3000"}
    - {name: API_CUE_BACKEND, value: "off"}
    - {name: API_MUSIC_BACKEND, value: "off"}
    - {name: API_PERSISTENCE_BACKEND, value: memory}
    - {name: API_AUDIO_BACKEND, value: "off"}
    - {name: API_AUTH_ADMIN_USERNAME, value: evaluser}
    - {name: API_AUTH_ADMIN_PASSWORD, value: "${EVAL_PASSWORD}"}
    - {name: API_AUTH_SECRET, value: "${EVAL_AUTH_SECRET}"}
    resources:
      requests: {cpu: "2", memory: 2Gi}
      limits: {memory: 4Gi}
  volumes:
  - name: models
    emptyDir: {sizeLimit: 200Gi}
  - name: shm
    emptyDir: {medium: Memory, sizeLimit: 16Gi}
